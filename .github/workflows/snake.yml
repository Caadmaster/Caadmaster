name: Generate Snake

on:
  schedule:
    - cron: "0 */6 * * *" # runs every 6 hours
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          # github user name to read the contribution graph from (**Github User Name**)
          github_user_name: Caadmaster

          # list of files to generate.
          # We use a custom color palette: Black background, Grey dots, and RED snake/commits
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=da291c&color_dots=#161b22,#451818,#8a1c1c,#da291c,#ff5c5c
      - uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
